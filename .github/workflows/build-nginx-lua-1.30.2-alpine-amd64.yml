name: Build nginx-lua 1.30.2 Alpine AMD64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'nginx/1.30.4/alpine/3.23.4/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: nginx/1.30.2/alpine/3.23.4
          file: nginx/1.30.2/alpine/3.23.4/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            ARCH=amd64
            BUILD_DATE=${{ github.run_id }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-lua:1.30.2-alpine3.23.4
            ${{ secrets.DOCKERHUB_USERNAME }}/nginx-lua:1.30.2-alpine
