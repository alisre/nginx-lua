name: Build nginx binary package

on:
  workflow_dispatch:
    inputs:
      nginx_ver:
        description: "Nginx version"
        required: true
        default: "1.30.3"
  push:
    branches:
      - main
      - "release/*"
    paths:
      - "Dockerfile.package"
      - ".github/workflows/build-nginx-package.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set version
        id: vars
        run: |
          VER="${{ github.event.inputs.nginx_ver || '1.30.3' }}"
          echo "nginx_ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "pkg_name=nginx-${VER}-linux-amd64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f Dockerfile.package \
            --build-arg NGINX_VER="${{ steps.vars.outputs.nginx_ver }}" \
            --output "type=local,dest=./dist" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.pkg_name }}
          path: dist/${{ steps.vars.outputs.pkg_name }}
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.vars.outputs.pkg_name }}
          tag_name: ${{ github.ref_name }}
          name: "nginx-lua ${{ steps.vars.outputs.nginx_ver }}"
          body: |
            Self-contained nginx ${{ steps.vars.outputs.nginx_ver }} + Lua binary for Linux (amd64/glibc).

            **Deploy:**
            ```bash
            tar -C /usr/local -xzf ${{ steps.vars.outputs.pkg_name }}
            sudo /usr/local/nginx/install.sh   # create nginx user (UID 1001)
            sudo /usr/local/nginx/sbin/nginx
            ```